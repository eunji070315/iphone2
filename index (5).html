</style></head>
<body>
<div id="cap">[휴대폰 주인의 아이폰]</div>
<div id="wrap"><div id="fr"><div id="scr">
<div id="home" class="L h"></div>
<div id="app" class="L h"></div>
<div id="lock" class="L h" data-a="padopen"><div class="L wp"></div><div id="lt"></div><div id="nl"></div><div id="lh">화면을 눌러 잠금 해제</div>
<div id="pad" class="L h" data-a="nop"><h3>암호 입력</h3><div class="dt" id="dots"><i></i><i></i><i></i><i></i></div><div id="pm"></div><div class="kp" id="kp"></div><div id="pc2" data-a="cancel">취소</div></div></div>
<div id="call" class="L h" data-a="tap"></div>
<div id="bn"></div><div id="tt"></div>
<div id="nm" class="L h"><div class="nf"><h2>이 휴대폰의 주인은 누구인가요?</h2><div class="nr"><input id="ln" maxlength="3" placeholder="성 (김)"><input id="fn" maxlength="6" placeholder="이름 (윤아)"></div><button data-a="go">시작하기</button></div></div>
<div id="bt" class="L h"><div class="ring"></div><div id="bname"></div></div>
<div id="off" class="L" data-a="wake">눌러서 전원 켜기</div>
<div id="sb" class="h"><b id="clk"></b><i>▂▄▆ 5G <span class="bat"><u></u></span></i></div><div id="isl"></div><div id="hb" class="h" data-a="gohome"></div>
</div></div></div>
<div id="note">화면을 눌러 전원을 켜보세요</div>
<button id="pw" class="h">화면 끄기</button>
<script>
const $=q=>document.querySelector(q),sl=ms=>new Promise(r=>setTimeout(r,ms)),R=DATA.rooms,X={},A={},V={},scr=$('#scr');
const M=JSON.parse(JSON.stringify(DATA.memos));
let NM={full:'김윤아',first:'윤아'},SC=1,C=null,D=null;
let S={scr:'off',busy:0,wrong:0,pin:'',app:null,room:null,sub:null,done:{},miss:0,loc:0,ask:0,callDone:0,sunny:0,clk:DATA.clock,named:0,mp:[-499,-1100],cm:9,cd:20,rs:[...DATA.search],liveOn:0};
DATA.calls.forEach(c=>{if(c[1]=='m')S.miss+=+(c[0].match(/\((\d+)\)/)||[0,1])[1]});
const T=s=>s.replace(/\$N/g,NM.full).replace(/\$n/g,NM.first),E=s=>s.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
const cols=['#f08a8a','#f0b36a','#7cc7a0','#6aa9f0','#a78bf0','#e98ac0'];
const av=(n,z=44,sq=0)=>`<div class=av style="width:${z}px;height:${z}px;background:${cols[[...n].reduce((a,c)=>a+c.charCodeAt(0),0)%6]};border-radius:${sq?z*.38:z/2}px;font-size:${z*.4}px">${n[0]}</div>`;
function fit(){SC=Math.min((innerHeight-110)/894,(innerWidth-8)/422,1.35);$('#fr').style.transform=`scale(${SC})`;$('#wrap').style.width=422*SC+'px';$('#wrap').style.height=894*SC+'px'}
addEventListener('resize',fit);fit();
function toast(t){const e=$('#tt');e.textContent=t;e.classList.add('on');clearTimeout(e.k);e.k=setTimeout(()=>e.classList.remove('on'),1700)}
function P(k,s){if(s[0]=='~')return{d:T(s.slice(1))};let tm=s.slice(0,5),x=s.slice(6),me=0,w='';if(x[0]=='>'){me=1;x=x.slice(1)}if(R[k].g&&!me){const i=x.indexOf(':');w=x.slice(0,i);x=x.slice(i+1)}return{me,w,x:T(x),tm}}
const last=k=>{const m=R[k].m;for(let i=m.length-1;i>=0;i--)if(m[i][0]!='~')return P(k,m[i]);return{x:'',tm:''}};
const set=(a,n)=>{const e=$('#b-'+a);if(e){e.textContent=n>99?'99+':n;e.style.display=n?'flex':'none'}};
function badge(){const c=d=>Object.values(R).reduce((a,r)=>a+(r.k==d?r.u:0),0);set('ms',c('m'));set('kk',c('k'));set('ph',S.miss)}
function setClk(){$('#clk').textContent=S.clk;const w=$('#wt');if(w)w.textContent=S.clk;const l=$('#lt h1');if(l)l.textContent=S.clk}
function setSB(){const on=['lock','home'].includes(S.scr);$('#sb').classList.toggle('h',!on);const dark=S.scr=='home'&&S.app&&!C;$('#sb').classList.toggle('d',!!dark);$('#hb').classList.toggle('h',!on);$('#hb').classList.toggle('d',!!dark);$('#pw').classList.toggle('h',!on);setClk()}
const wxT=()=>S.sunny?DATA.wx2:DATA.wx;
/* ---------- home ---------- */
const APPS=[['mp','지도','#2bd04f','<svg viewBox="0 0 24 24" width="38" fill="#fff"><path d="M12 2a7 7 0 0 0-7 7c0 5 7 13 7 13s7-8 7-13a7 7 0 0 0-7-7zm0 9.500A2.500 2.500 0 1 1 12 6.500a2.500 2.500 0 0 1 0 5z"/></svg>'],['nv','네이버','#03c75a','<b style="color:#fff;font-size:42px;font-weight:900">N</b>'],['mm','메모','#fff','<div style="width:100%;height:16px;background:#f7d44c;position:absolute;top:0"></div><div style="width:70%;margin-top:14px;display:grid;gap:7px"><i style="height:2px;background:#ddd"></i><i style="height:2px;background:#ddd"></i><i style="height:2px;background:#ddd"></i></div>'],['ms','메시지','linear-gradient(#5cf36f,#12c22e)','<svg viewBox="0 0 24 24" width="40" fill="#fff"><path d="M12 3C6.5 3 2 6.6 2 11c0 2.400 1.300 4.500 3.400 6L4.500 21l4.200-2.300c1 .2 2.100.3 3.300.3 5.500 0 10-3.600 10-8S17.500 3 12 3z"/></svg>'],['kk','카카오톡','#fae100','<div style="background:#3a1d1d;border-radius:50%;width:48px;height:36px;display:flex;align-items:center;justify-content:center;color:#fae100;font:900 13px sans-serif">TALK</div>'],['ph','전화','linear-gradient(#5cf36f,#12c22e)','<svg viewBox="0 0 24 24" width="36" fill="#fff"><path d="M6.600 10.800c1.400 2.800 3.800 5.200 6.600 6.600l2.200-2.200c.3-.3.7-.4 1-.2 1.100.4 2.300.6 3.600.6.600 0 1 .4 1 1V20c0 .6-.4 1-1 1C10.600 21 3 13.400 3 4c0-.6.4-1 1-1h3.500c.6 0 1 .4 1 1 0 1.300.2 2.500.6 3.600.1.300 0 .7-.2 1z"/></svg>'],['cl','일정','#fff','<div style="color:#ff3b30;font-size:10px;font-weight:700">화요일</div><div style="font-size:32px;font-weight:300;line-height:1">20</div>']];
function buildHome(){$('#home').innerHTML=`<div class="L wp"></div><div id=wg><div id=wt>${S.clk}</div><div class=wd>${DATA.date}</div><div id=wx>${wxT()}</div></div><div id=grid>${APPS.map(a=>`<div class=ap data-a=app data-v=${a[0]}><div class=ic><div class=ib style="background:${a[2]}">${a[3]}</div><i class=bdg id=b-${a[0]} style=display:none></i></div><span>${a[1]}</span></div>`).join('')}</div>`;badge()}
/* ---------- flow ---------- */
A.wake=()=>{if(!S.named){$('#off').classList.add('h');$('#nm').classList.remove('h');$('#note').textContent='이름을 입력하세요'}else{$('#off').classList.add('h');showLock();lockNotifs()}};
A.go=async()=>{NM.first=($('#fn').value.trim()||'윤아');NM.full=($('#ln').value.trim()||'김')+NM.first;S.named=1;$('#nm').classList.add('h');$('#bname').textContent=NM.full;$('#bt').classList.remove('h');buildHome();await sl(2000);$('#bt').classList.add('h');$('#note').textContent='화면을 눌러 잠금을 풀어보세요';burst()};
function showLock(){S.scr='lock';$('#lock').classList.remove('h');$('#lock').style.transform='';$('#home').classList.add('h');$('#app').classList.add('h');S.app=null;S.room=null;$('#lt').innerHTML=`<p>${DATA.date.slice(6)}</p><h1>${S.clk}</h1>`;$('#nl').innerHTML='';$('#lh').style.display='';setSB()}
const ncH=a=>`<div class=nc><div class=ni style="background:${a.i=='k'?'#fae100':a.i=='m'?'#34c759':'#34c759'}">${a.i=='k'?'💬':a.i=='m'?'✉️':'📞'}</div><div><b>${E(a.n)}</b><p>${E(a.x)}</p></div></div>`;
function alerts(){const a=[];Object.keys(R).forEach(k=>{const r=R[k];if(r.u&&!r.hid)r.m.filter(s=>s[0]!='~'&&s[6]!='>').slice(-r.u).slice(-2).forEach(s=>{const p=P(k,s);a.push({t:p.tm,i:r.k,n:r.n,x:p.x})})});DATA.calls.forEach(c=>{if(c[1]=='m')a.push({t:c[2],i:'c',n:'부재중 전화',x:c[0]})});return a.sort((x,y)=>x.t<y.t?-1:1).slice(-20)}
async function burst(){showLock();S.busy=1;const al=alerts(),n=al.length;for(let i=0;i<n;i++){const sw=n-i<=7;scr.style.setProperty('--a',sw?.4*(n-i)/8:.4);scr.classList.add('vib');$('#nl').insertAdjacentHTML('afterbegin',ncH(al[i]));await sl(sw?170+(8-(n-i))*85:140)}scr.classList.remove('vib');await sl(500);
const tk=Object.values(R).reduce((a,r)=>a+(r.k=='k'?r.u:0),0),tm=Object.values(R).reduce((a,r)=>a+(r.k=='m'?r.u:0),0);$('#nl').innerHTML=ncH({i:'k',n:'카카오톡',x:'정하린 외 '+tk+'개의 안 읽은 메시지'})+ncH({i:'c',n:'전화',x:'부재중 전화 '+S.miss+'건'})+ncH({i:'m',n:'메시지',x:'엄마 외 '+tm+'개의 안 읽은 문자'})+`<div class=more>알림 ${tk+tm+S.miss-3}개 더 보기</div>`;S.busy=0}
function lockNotifs(){let h='';Object.keys(R).forEach(k=>{const r=R[k];if(r.u&&!r.hid)h+=ncH({i:r.k,n:r.n+(r.u>1?' ('+r.u+')':''),x:last(k).x})});if(S.miss)h+=ncH({i:'c',n:'전화',x:'부재중 전화 '+S.miss+'건'});$('#nl').innerHTML=h;S.busy=0}
A.padopen=()=>{if(S.busy||S.scr!='lock')return;S.pin='';$('#pad').classList.remove('h');$('#lh').style.display='none';$('#kp').innerHTML=[1,2,3,4,5,6,7,8,9,'',0,'⌫'].map(k=>k===''?'<div></div>':`<div class=kk data-a=key data-v=${k}>${k}</div>`).join('');dots();$('#pm').textContent=''};
A.cancel=()=>{$('#pad').classList.add('h');$('#lh').style.display=''};A.nop=()=>{};
const dots=()=>[...$('#dots').children].forEach((d,i)=>d.classList.toggle('f',i<S.pin.length));
A.key=v=>{if(v=='⌫'){S.pin=S.pin.slice(0,-1);dots();return}if(S.pin.length>=4)return;S.pin+=v;dots();if(S.pin.length==4)setTimeout(()=>{if(S.pin==DATA.pin)unlock();else{S.wrong++;S.pin='';const d=$('#dots');d.classList.remove('s');void d.offsetWidth;d.classList.add('s');$('#pm').innerHTML='암호가 맞지 않아요'+(S.wrong>=2?`<br>힌트: ${DATA.hint}`:'');dots()}},140)};
addEventListener('keydown',e=>{if($('#pad').classList.contains('h')||e.target.tagName=='INPUT')return;if(/^\d$/.test(e.key))A.key(e.key);else if(e.key=='Backspace')A.key('⌫')});
async function unlock(){const l=$('#lock');l.style.transition='transform .45s cubic-bezier(.32,.72,0,1)';l.style.transform='translateY(-100%)';$('#home').classList.remove('h');S.scr='home';setSB();await sl(460);l.classList.add('h');l.style.transition='';$('#pad').classList.add('h');if(!S.liveOn){S.liveOn=1;live()}}
async function live(){await sl(1800);for(const it of DATA.live){if(it[0]=='call'){banner('c','강태오','수신 전화',()=>openApp('ph'));S.miss++;badge();await sl(3000)}else{push(it[0],it[1]);await sl(2000)}}}
$('#pw').onclick=async()=>{if(C)return;S.scr='off';scr.classList.remove('vib');['home','app','lock','call'].forEach(i=>$('#'+i).classList.add('h'));$('#off').classList.remove('h');$('#off').textContent='눌러서 전원 켜기';$('#bn').classList.remove('on');setSB()};
/* ---------- apps ---------- */
function openApp(n,o={},ic){S.app=n;S.room=null;S.sub=null;Object.assign(S,o);const a=$('#app');a.classList.remove('h');S.scr='home';$('#home').classList.remove('h');view();setSB();if(!a.animate)return;let ox='50%',oy='40%';if(ic){const r=ic.getBoundingClientRect(),s=scr.getBoundingClientRect();ox=(r.left+r.width/2-s.left)/SC+'px';oy=(r.top+r.height/2-s.top)/SC+'px'}a.style.transformOrigin=ox+' '+oy;a.animate([{transform:'scale(.15)',opacity:0,borderRadius:'40px'},{transform:'scale(1)',opacity:1,borderRadius:'0px'}],{duration:380,easing:'cubic-bezier(.32,.72,0,1)'});if(o.room)enter(o.room)}
function closeApp(){const a=$('#app');if(a.classList.contains('h'))return;S.app=null;S.room=null;setSB();const f=()=>a.classList.add('h');a.animate?a.animate([{transform:'scale(1)',opacity:1},{transform:'scale(.2)',opacity:0}],{duration:260,easing:'cubic-bezier(.32,.72,0,1)'}).onfinish=f:f()}
A.app=(v,t)=>openApp(v,{},t);A.gohome=()=>{if(S.app)closeApp()};
A.back=()=>{if(S.app=='mm'&&S.sub!=null){S.sub=null;view()}else if(S.app=='nv'&&S.sub){S.sub=null;view()}else if(S.room){S.room=null;S.ask&&0;view()}else closeApp()};
function view(){$('#app').innerHTML=V[S.app]()}
const refresh=()=>{if(S.room&&$('#bd')){const b=$('#bd');b.innerHTML=body(S.room);b.scrollTop=b.scrollHeight;$('#ft').innerHTML=ftH(S.room)}else if(S.app&&!S.room&&['kk','ms','ph'].includes(S.app))view()};
const isOpen=k=>S.room==k&&S.scr=='home'&&!$('#app').classList.contains('h');
/* lists + rooms */
function listH(d){return `<div class="${d=='m'?'ml':''}"><div class=ah><a data-a=back>‹</a><h1>${d=='k'?'채팅':'메시지'}</h1></div><div class=sc>${Object.keys(R).filter(k=>R[k].k==d&&!R[k].hid).map(k=>{const r=R[k],l=last(k);return `<div class=row data-a=room data-v=${k}>${av(r.n,50,d=='k')}<div class=rc><b>${r.n}${r.g?` <s>${r.c}</s>`:''}</b><p>${E(l.x=='[사진]'?'사진':l.x)}</p></div><div class=rr><span>${l.tm}</span>${r.u?`<em>${r.u}</em>`:''}</div></div>`}).join('')}</div></div>`}
V.kk=()=>S.room?roomH(S.room):listH('k');V.ms=()=>S.room?roomH(S.room):listH('m');
function roomH(k){const r=R[k];return `<div class="rm ${r.k}"><div class=rh><a data-a=back>‹</a><div class=rt>${r.k=='m'?av(r.n,36):''}<b>${r.n}${r.g?` <s>${r.c}</s>`:''}</b></div></div><div id=bd class=bd>${body(k)}</div><div id=pl class=h></div><div id=ft>${ftH(k)}</div></div>`}
const bc=m=>m.x=='[사진]'?'<div class=ph2>📷<br>원본 저장 기간이 만료되어<br>미리보기만 할 수 있어요.</div>':m.x=='[위치]'?`<div class=lc><div class=lm></div><b>여의도한강공원</b><p>서울 영등포구 여의동로 330</p></div>`:E(m.x);
function body(k){const r=R[k],ms=r.m.map(s=>P(k,s));let h='',pv=null;ms.forEach((m,i)=>{if(m.d){h+=`<div class=ds>${m.d}</div>`;pv=null;return}const nx=ms[i+1],f=!pv||pv.me!=m.me||pv.w!=m.w,l=!nx||nx.d||nx.me!=m.me||nx.w!=m.w;pv=m;
if(r.k=='k'){h+=m.me?`<div class="mr me ${f?'f':''}"><small>${l?m.tm:''}</small><div class=bb>${bc(m)}</div></div>`:`<div class="mr ${f?'f':''}">${f?av(m.w||r.n,38,1):'<div class=sp></div>'}<div class=cc>${f?`<span>${m.w||r.n}</span>`:''}<div class=bl2><div class=bb>${bc(m)}</div><small>${l?m.tm:''}</small></div></div></div>`}
else h+=`<div class="ir ${m.me?'me':''} ${f?'f':''}"><div class=ib2>${bc(m)}</div>${l?`<small>${m.tm}</small>`:''}</div>`});return h}
function ftH(k){const r=R[k];if(r.pend)return `<div class=chs>${r.pend.map((o,i)=>`<button class=ch data-a=pick data-v=${i}>${E(T(o[0]))}</button>`).join('')}</div>`;return `<div class=in><i data-a=plus class="pb ${S.ask&&!S.loc&&k=='kh'?'bl':''}">＋</i><div class=fi>${r.k=='k'?'메시지 입력':'iMessage'}</div></div>`}
A.room=v=>{S.room=v;view();enter(v)};
function enter(k){R[k].u=0;badge();const b=$('#bd');if(b)b.scrollTop=b.scrollHeight;if(k=='kh'&&S.callDone)S.done.kh=1;if(DATA.sc[k]&&!S.done[k]){S.done[k]=1;setTimeout(()=>run(k,DATA.sc[k]),1000)}}
function push(k,s){const r=R[k];r.hid=0;const m=s.match(/^(\d\d:\d\d)/);if(m){S.clk=m[1];setClk()}r.m.push(s);const me=s.slice(6)[0]=='>';if(isOpen(k)){refresh()}else{if(!me){r.u++;badge();if(S.scr=='home')banner(r.k,r.n,T(s.slice(6).replace(/^[^:]*:/,x=>r.g?'':x)),()=>openApp(r.k=='k'?'kk':'ms',{room:k}))}refresh()}}
function banner(i,n,x,fn){const b=$('#bn');b.innerHTML=`<div class=ni style="background:${i=='k'?'#fae100':'#34c759'}">${i=='k'?'💬':i=='m'?'✉️':'📞'}</div><div><b>${E(n)}</b><p>${E(x)}</p></div>`;b.onclick=()=>{b.classList.remove('on');fn()};b.classList.add('on');clearTimeout(b.t);b.t=setTimeout(()=>b.classList.remove('on'),3600)}
async function run(k,st){for(const s of st){if(typeof s=='string'){if(s[0]=='@'){await X[s.slice(1)](k);continue}await them(k,s)}else await run(k,await choose(k,s.c))}}
async function them(k,s){if(isOpen(k)){const b=$('#bd');b.insertAdjacentHTML('beforeend','<div class="ty" id=ty><i></i><i></i><i></i></div>');b.scrollTop=b.scrollHeight;await sl(1500);$('#ty')&&$('#ty').remove()}else await sl(900);push(k,s)}
const choose=(k,o)=>new Promise(res=>{R[k].pend=o;R[k].res=res;if(isOpen(k))$('#ft').innerHTML=ftH(k)});
A.pick=v=>{const k=S.room,r=R[k],o=r.pend[v];r.pend=null;if(o[0][0]!='(')push(k,S.clk+' >'+T(o[0]));else $('#ft').innerHTML=ftH(k);r.res(o[1])};
A.plus=()=>{if(R[S.room].k!='k')return toast('지금은 사용할 수 없어요');const p=$('#pl');p.innerHTML='<b data-a=pf>앨범</b><b data-a=pf>카메라</b><b data-a=loc>위치</b>';p.classList.toggle('h')};A.pf=()=>toast('지금은 사용할 수 없어요');
A.loc=()=>{$('#pl').classList.add('h');if(S.loc)return toast('이미 위치를 공유했어요');if(S.room!='kh')return toast('하린이에게 보내야 해요');S.loc=1;S.ask=0;push('kh',S.clk+' >[위치]');X.afterLoc()};
X.afterLoc=async()=>{await sl(1500);for(const s of DATA.locReply){await them('kh',s)}S.t=setTimeout(()=>callIn(),20000)};
X.ky=async()=>{await sl(3500);push('ky',DATA.kyFirst)};
X.memo=async()=>{M[1].b[0]='[x] '+M[1].b[0].slice(4);M[1].b.push('[x] 전민준·강태오 제작 및 유포 자백 확보');await sl(800);banner('m','메모',"'신고할 때 필요한 것' 항목 자동 체크됨: 제작 및 유포 자백 확보",()=>openApp('mm'))};
X.call=async()=>{await sl(1200);callIn()};
/* ---------- calls ---------- */
const fmt=t=>String(t/60|0).padStart(2,'0')+':'+String(t%60).padStart(2,'0');
function mkC(st){return{st,i:-1,second:!!S.loc,l:(S.loc?DATA.call2:DATA.call1).map(T),h:0,ok:0,lock:0,t:0}}
function callIn(){if(C)return;C=mkC('in');drawCall();if(!C.second)C.tm=setTimeout(()=>{if(C&&C.st=='in')missed()},DATA.miss)}
function callOut(){if(C)return;clearTimeout(S.t20);C=mkC('out');drawCall();C.tm=setTimeout(()=>{if(C){C.st='act';startAct()}},2000)}
function drawCall(){const c=$('#call');c.classList.remove('h');S.scr='home';c.innerHTML=`<div class=cn>${DATA.callName}</div><div id=cs class=cs></div><div class="bigav ${C.st=='in'?'pu':''}">${av(DATA.callName,110)}</div><div id=cl class=cl></div><div id=cbt class=cbt></div><div class=th id=th></div>`;upd();setSB()}
function upd(){const c=C,b=$('#cbt');$('#cs').textContent=c.st=='in'?'휴대전화':c.st=='out'?'발신 중…':fmt(c.t);const dis=c.st=='act'?!c.ok:c.second;b.innerHTML=c.st=='in'?`${c.second?'':'<div class="rb r" data-a=dec>✕<s>거절</s></div>'}<div class="rb g" data-a=acc>✆<s>수락</s></div>`:`<div class="rb r ${dis?'dis':''}" data-a=end>✆<s>끊기</s></div>`;$('#th').textContent=c.st=='act'?'화면을 눌러 다음 대사':''}
A.acc=()=>{clearTimeout(C.tm);C.st='act';startAct()};
function startAct(){C.i=0;C.t=0;C.iv=setInterval(()=>{C.t++;const e=$('#cs');e&&(e.textContent=fmt(C.t))},1000);showLine(C.l[0]);upd()}
const showLine=t=>{$('#cl').innerHTML='<p>'+E(t)+'</p>'};
A.tap=async()=>{if(!C||C.st!='act'||C.lock||C.i>=C.l.length-1)return;C.i++;if(!C.second&&C.i==DATA.tear){C.lock=1;const t=document.createElement('div');t.className='tear';$('#call').appendChild(t);await sl(1500);t.remove();C.lock=0}showLine(C.l[C.i]);if(C.i==C.l.length-1){C.ok=1;upd()}};
A.end=()=>{if(!C)return;if(C.st=='out'&&!C.second){clearTimeout(C.tm);C=null;$('#call').classList.add('h');setSB();return}if(C.st!='act'||!C.ok)return;if(!C.second&&C.h<DATA.hold.length){showLine(DATA.hold[C.h++]);return}endCall()};
A.dec=()=>missed();
function missed(){clearTimeout(C.tm);$('#call').classList.add('h');C=null;S.miss++;badge();setSB();push('kh',DATA.missA);S.t20=setTimeout(()=>{S.ask=1;push('kh',DATA.missB)},DATA.callback)}
function endCall(){const c=C;clearInterval(c.iv);$('#call').classList.add('h');C=null;S.callDone++;setSB();if(c.second)finish2();else askLoc()}
async function askLoc(){await sl(900);S.ask=1;push('kh',DATA.ask);await sl(DATA.locWait);if(!S.loc)push('kh',DATA.askB)}
async function finish2(){await sl(500);S.sunny=1;const w=$('#wx');if(w){w.style.opacity=0;await sl(600);w.textContent=wxT();w.style.opacity=1}await sl(2800);ending()}
function ending(){scr.insertAdjacentHTML('beforeend',`<div id=en class=L><h1>${DATA.endTitle}</h1>${DATA.endLines.map(l=>`<p>${l}</p>`).join('')}<button data-a=again>처음부터 다시 보기</button><small>${DATA.endNote}</small></div>`)}A.again=()=>location.reload();
/* phone */
V.ph=()=>{if(S.miss){S.miss=0;badge()}return `<div><div class=ah><a data-a=back>‹</a><h1>최근 통화</h1></div><div class=sc>${DATA.calls.map(c=>`<div class=row>${av(c[0],44)}<div class=rc><b style="color:${c[1]=='m'?'#ff3b30':'#111'}">${c[0]}</b><p>${c[1]=='m'?'↙ 부재중':c[1]=='o'?'↗ 발신 · '+c[3]:'↙ 수신 · '+c[3]}</p></div><div class=rr><span>${c[1]=='m'?'오늘 ':'오늘 '}${c[2]}</span></div><div class="av" data-a=dial data-v="${c[0]}" style="width:38px;height:38px;border-radius:50%;background:#34c759">✆</div></div>`).join('')}</div></div>`};
A.dial=v=>{if(v.startsWith('정하린'))callOut();else toast('통화 연결이 되지 않아요')};
/* memo */
V.mm=()=>S.sub==null?`<div><div class=ah><a data-a=back>‹</a><h1>메모</h1></div><div class=sc>${M.map((m,i)=>`<div class=mc data-a=memo data-v=${i}><b>${m.t}</b><p>${m.d} · ${E(m.b[0].replace(/^(\[.\]|•) ?/,''))}</p></div>`).join('')}</div></div>`:`<div><div class=ah><a data-a=back>‹ 메모</a></div><div class=mb2><div class=mdate>${M[S.sub].d}</div><h2>${M[S.sub].t}</h2>${M[S.sub].b.map((l,i)=>l[0]=='['?`<div class=ck data-a=chk data-v=${i}><i class="${l[1]=='x'?'on':''}"></i><span class="${l[1]=='x'?'dn':''}">${E(l.slice(4))}</span></div>`:`<p>${E(l)}</p>`).join('')}</div></div>`;
A.memo=v=>{S.sub=+v;view()};A.chk=v=>{const b=M[S.sub].b;b[v]=(b[v][1]=='x'?'[ ] ':'[x] ')+b[v].slice(4);view()};
/* naver */
V.nv=()=>S.sub=='s'?`<div><div class=ah><a data-a=back>‹</a><h1 style="font-size:20px">검색</h1></div><div class=sc><div class=rh2><b>최근 검색어</b><a data-a=rsall>전체삭제</a></div>${[...S.rs].reverse().map(q=>`<div class=row><span>${E(q)}</span><a data-a=rsdel data-v="${E(q)}" style="color:#aaa">✕</a></div>`).join('')||'<div class=row style=color:#aaa>최근 검색어가 없어요</div>'}</div></div>`:`<div><div class=nsb data-a=nsr><b class=nn>N</b>검색어를 입력하세요</div><div class=sg>${[['뉴스','📰'],['카페','☕'],['블로그','✍️'],['쇼핑','🛍️'],['지도','📍'],['웹툰','🎨'],['증권','📈'],['더보기','⋯']].map(a=>`<div><span>${a[1]}</span>${a[0]}</div>`).join('')}</div><div class=wc>${S.sunny?'🌫️ ':'☁️ '}${wxT()}</div><div class=sc><div class=rh2><b>오늘의 소식</b></div>${DATA.news.map(n=>`<div class=nw><small>${n[0]}</small>${E(n[1])}</div>`).join('')}</div></div>`;
A.nsr=()=>{S.sub='s';view()};A.rsall=()=>{S.rs=[];view()};A.rsdel=v=>{S.rs=S.rs.filter(q=>q!=v);view()};
/* calendar */
V.cl=()=>{const m=S.cm,f=new Date(2026,m,1).getDay(),dm=new Date(2026,m+1,0).getDate();let c='';for(let i=0;i<f;i++)c+='<i></i>';for(let d=1;d<=dm;d++){const k=(m+1)+'-'+d,w=(f+d-1)%7,h=DATA.hol[k],cl=h||w==0?'rd':w==6?'bl3':'';c+=`<div class="dc ${cl} ${S.cd==d?'sl':''}" data-a=day data-v=${d}><span class="${m==9&&d==20?'td':''}">${d}</span>${DATA.events.some(e=>e[0]==k)?'<u></u>':''}</div>`}
const k=(m+1)+'-'+S.cd,ev=DATA.events.filter(e=>e[0]==k),h=DATA.hol[k];return `<div class=cal><div class=ah style="padding-left:8px"><a data-a=back>‹</a><h1>일정</h1></div><div class=top><a data-a=pm data-v=-1>‹</a>2026년 ${m+1}월<a data-a=pm data-v=1>›</a><a data-a=today style="font-size:15px">오늘</a></div><div class="g7 w">${'일월화수목금토'.split('').map((x,i)=>`<div class="${i==0?'rd':i==6?'bl3':''}">${x}</div>`).join('')}</div><div class=g7>${c}</div>${h?`<div class=ev style="color:#ff3b30"><b>${h}</b></div>`:''}${ev.map(e=>`<div class=ev><b>${e[2]}</b>${e[1]} ${e[3]}</div>`).join('')||(h?'':'<div class=ev>일정 없음</div>')}</div>`};
A.day=v=>{S.cd=+v;view()};A.pm=v=>{S.cm=Math.max(0,Math.min(11,S.cm+ +v));S.cd=1;view()};A.today=()=>{S.cm=9;S.cd=20;view()};
/* map */
const cl=(v,a)=>Math.max(a,Math.min(0,v));
V.mp=()=>`<div style="position:relative"><div id=mvw><div id=mv style="transform:translate(${S.mp[0]}px,${S.mp[1]}px)"><div class=rv></div><div class=pk style="left:1200px;top:900px"></div><div class=pk style="left:300px;top:1200px"></div><div class=pk style="left:900px;top:300px"></div>${DATA.places.map((p,i)=>`<div class=pin style="left:${p[3]}px;top:${p[4]}px" data-a=place data-v=${i}>📍<s>${p[0]}</s></div>`).join('')}<div class=me2 style="left:700px;top:1500px"></div></div></div><div class=msb>🔍 장소·버스·지하철·주소 검색</div><div class=chips>${['음식점','카페','편의점','병원','약국'].map(x=>`<span>${x}</span>`).join('')}</div><div class=lc2 data-a=here>◎</div><div class=bk data-a=sv>🔖</div><div id=svp class=h>${DATA.places.map((p,i)=>`<div data-a=place data-v=${i}>${p[0]}<small>${p[2]}</small></div>`).join('')}</div><div id=pcd class=h></div><div class=mtab><div>🗺️<br>지도</div><div>📍<br>주변</div><div>⭐<br>저장</div><div>🧭<br>길찾기</div><div>👤<br>MY</div></div></div>`;
function pan(x,y,smooth){S.mp=[cl(x,402-2000),cl(y,874-2000)];const m=$('#mv');m.style.transition=smooth?'transform .5s cubic-bezier(.32,.72,0,1)':'';m.style.transform=`translate(${S.mp[0]}px,${S.mp[1]}px)`}
A.place=v=>{const p=DATA.places[v];$('#svp').classList.add('h');pan(201-p[3],380-p[4],1);const c=$('#pcd');c.classList.remove('h');c.innerHTML=`<b>${p[0]}</b><span>${p[1]} · ${p[2]}</span><u data-a=toast>출발</u><u data-a=toast>도착</u><i data-a=pcl style="font-style:normal">✕</i>`};
A.toast=()=>toast('길찾기는 준비 중이에요');A.pcl=()=>$('#pcd').classList.add('h');A.sv=()=>$('#svp').classList.toggle('h');A.here=()=>{pan(201-700,380-1500,1);toast('현재 위치: '+DATA.here)};
scr.addEventListener('pointerdown',e=>{if(e.target.closest('#mvw')&&!e.target.closest('[data-a]'))D={x:e.clientX,y:e.clientY,o:[...S.mp]}});
addEventListener('pointermove',e=>{if(D)pan(D.o[0]+(e.clientX-D.x)/SC,D.o[1]+(e.clientY-D.y)/SC)});addEventListener('pointerup',()=>D=null);
/* delegation */
scr.addEventListener('click',e=>{const t=e.target.closest('[data-a]');if(t){const f=A[t.dataset.a];f&&f(t.dataset.v,t,e)}});
</script></body></html>
